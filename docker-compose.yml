services:
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bankingv2
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  banking-api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: banking-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bankingv2
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass

      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: Mail UserName
      SPRING_MAIL_PASSWORD: App password

      JWT_SECRET: MySecretKeyThatIsAtLeast32CharactersForHmacAlgorithm

      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"
    networks:
      - banking-network


volumes:
  mysql-data:

networks:
  banking-network:
    driver: bridge